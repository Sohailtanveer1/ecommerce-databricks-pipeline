# Pipeline configuration
# Secrets (credentials, connection strings) are NEVER stored here --
# they're pulled at runtime from a Key Vault / Secrets Manager-backed
# Databricks secret scope (see src/ingestion scripts).

environment: production

storage:
  cloud: azure   # or aws
  raw_landing_path: "abfss://raw@storageaccount.dfs.core.windows.net/"
  # aws equivalent: "s3://raw-bucket/"

catalog:
  name: lakehouse_catalog
  schemas:
    bronze: bronze
    silver: silver
    gold: gold
    governance: governance

ingestion:
  orders:
    mode: batch_incremental
    watermark_column: updated_at
    schedule: "0 * * * *"        # hourly
  clickstream:
    mode: autoloader
    schedule: "0 */2 * * *"       # sweep every 2 hours (trigger=availableNow)
  payments:
    mode: batch_incremental
    schedule: "0 1 * * *"          # daily at 1am
  marketing_spend:
    mode: batch_full
    schedule: "0 2 * * *"          # daily at 2am

# ------------------------------------------------------------------
# Data quality / validation rules, consumed by common.data_quality.from_config.
# on_failure: fail (stop pipeline) | warn (log, pass through) | quarantine
# (route bad rows to a side table, pass the rest).
# ------------------------------------------------------------------
data_quality:
  orders:
    on_failure: quarantine
    quarantine_table: silver.orders_quarantine
    not_null: [order_id, customer_id, order_date]
    unique: [order_id]
    ranges:
      amount: { min: 0 }
    allowed_values:
      order_status: [pending, paid, shipped, delivered, cancelled, returned]
    min_row_count: 0
    freshness:
      column: updated_at
      max_age_hours: 48

  customers:
    on_failure: quarantine
    quarantine_table: silver.customers_quarantine
    not_null: [customer_id]
    unique: [customer_id]
    regex:
      email: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

scd2_tracked_attributes:
  dim_product: [category, product_name]
  dim_customer: [customer_segment, region]

# ------------------------------------------------------------------
# Optimization / maintenance, consumed by src/maintenance/table_maintenance.py.
# Prefers liquid clustering (cluster_by); zorder is the fallback layout.
# ------------------------------------------------------------------
optimization:
  frequency: weekly
  vacuum_retention_hours: 168        # 7 days
  table_properties:
    delta.autoOptimize.optimizeWrite: "true"
    delta.autoOptimize.autoCompact: "true"
    delta.tuneFileSizesForRewrites: "true"
    delta.enableDeletionVectors: "true"
  tables:
    gold.fact_orders:
      cluster_by: [order_date, customer_id]
      analyze_columns: [customer_id, product_id, order_date]
    silver.orders:
      cluster_by: [order_id]
    gold.dim_product:
      zorder: [product_id]
      vacuum: true
