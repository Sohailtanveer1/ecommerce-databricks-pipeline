name: Deploy

# Deployment flow (Databricks Asset Bundles):
#   * push to main            -> deploy to staging
#   * publish a vX.Y.Z tag    -> deploy to prod
#
# Credentials come from GitHub Environment secrets, never from the repo:
#   DATABRICKS_HOST, DATABRICKS_TOKEN  (or a service-principal OAuth pair).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t staging

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod   # gate with required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t prod
