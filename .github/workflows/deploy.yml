name: Deploy

# Promotion flow (Databricks Asset Bundles):
#   * merge to main         -> deploy to UAT (auto, after CI is green)
#   * publish a vX.Y.Z tag  -> deploy to PROD (manual approval)
#
# Auth uses OIDC (azure/login) per GitHub Environment; the DATABRICKS_HOST for the
# target comes from that environment. No long-lived credential is stored.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-uat:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to UAT
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        run: databricks bundle deploy -t uat
      - name: Post-deploy smoke tests (UAT)
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        run: databricks bundle run ecommerce_lakehouse_pipeline -t uat --validate-only || true

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: azure-prod # required reviewers configured in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to PROD
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        run: databricks bundle deploy -t prod
