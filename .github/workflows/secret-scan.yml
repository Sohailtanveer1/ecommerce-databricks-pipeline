name: Secret Scan

# Backstop secret scanning on every PR and push — catches anything that slips
# past the local pre-commit gitleaks hook. Scans the full history, not just the diff.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full git history
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for personal/public repos; orgs need a
          # GITLEAKS_LICENSE secret.
