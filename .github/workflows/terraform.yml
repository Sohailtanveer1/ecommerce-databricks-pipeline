name: Terraform

# Modular layout: modules/{foundation,platform} + environments/{dev,uat,prod}/{foundation,platform}.
# Promotion:
#   * PR                    -> fmt + validate + plan (dev) for review
#   * merge to main         -> apply to UAT
#   * publish a vX.Y.Z tag  -> apply to PROD (manual approval)
# Auth uses OIDC federated credentials — no long-lived cloud secret in GitHub.
on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths: ["infra/terraform/**"]

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [environments/dev/foundation, environments/dev/platform]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: fmt (recursive)
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: init (no backend) + validate
        working-directory: infra/terraform/${{ matrix.root }}
        run: |
          terraform init -backend=false
          terraform validate

  plan:
    needs: fmt-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: plan dev foundation
        working-directory: infra/terraform/environments/dev/foundation
        run: |
          terraform init
          terraform plan -input=false

  apply-uat:
    needs: fmt-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: apply UAT (foundation -> platform)
        run: |
          terraform -chdir=infra/terraform/environments/uat/foundation init
          terraform -chdir=infra/terraform/environments/uat/foundation apply -auto-approve
          terraform -chdir=infra/terraform/environments/uat/platform init
          terraform -chdir=infra/terraform/environments/uat/platform apply -auto-approve

  apply-prod:
    needs: fmt-validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: azure-prod # required reviewers gate the prod apply
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: apply PROD (foundation -> platform)
        run: |
          terraform -chdir=infra/terraform/environments/prod/foundation init
          terraform -chdir=infra/terraform/environments/prod/foundation apply -auto-approve
          terraform -chdir=infra/terraform/environments/prod/platform init
          terraform -chdir=infra/terraform/environments/prod/platform apply -auto-approve
