name: CI

# Lint + unit tests on every PR and every push to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest (unit tests + coverage)
        run: pytest --cov --cov-report=term-missing

  validate-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      # Validates databricks.yml + resources against the Databricks API schema.
      # No workspace credentials required for a syntax/schema validation.
      - name: Validate Databricks Asset Bundle (dev target)
        run: databricks bundle validate -t dev
