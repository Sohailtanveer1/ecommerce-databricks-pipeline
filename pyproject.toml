[project]
name = "ecommerce-lakehouse-pipeline"
version = "0.1.0"
description = "Medallion-architecture e-commerce data pipeline on Databricks / Delta Lake"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I), pyupgrade (UP), bugbear (B)
select = ["E", "W", "F", "I", "UP", "B"]
# Spark scripts reference `dbutils` / `spark`, injected by the Databricks Runtime.
ignore = ["F821"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src"]
branch = true
